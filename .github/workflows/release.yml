name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned rather than `macos-latest`: the macos-26 image fails signing
          # at `security set-key-partition-list` — the temp keychain
          # electron-builder creates no longer unlocks with the password it was
          # created with. overcli and overgit pin the same image for the same
          # reason. Revisit when a later image or electron-builder fixes it.
          - os: macos-15
            dist_script: dist:mac
          - os: windows-latest
            dist_script: dist:win
          - os: ubuntu-latest
            dist_script: dist:linux

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      # macOS builds are signed with the Developer ID and notarized when the
      # Apple credentials are present (org-level secrets, scoped to this repo).
      # Passed through MAC_-prefixed names and exported only on macOS so the
      # Windows and Linux jobs never see them; if they are absent the build
      # still succeeds, unsigned. Windows is not signed yet.
      - name: Build distributables
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CSC_LINK" ]; then
            echo "Apple credentials detected — building signed + notarized."
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            export APPLE_ID="$MAC_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "No Apple credentials available — building unsigned."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            export CSC_LINK=""
          fi
          npm run ${{ matrix.dist_script }}

      - name: Upload build artifacts (workflow run)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overdb-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

      - name: Checksums
        shell: bash
        run: |
          [ -d release ] || exit 0
          cd release
          shopt -s nullglob
          files=(*.dmg *.zip *.exe *.AppImage *.deb)
          [ ${#files[@]} -gt 0 ] || exit 0
          if command -v sha256sum >/dev/null; then sha256sum "${files[@]}"; else shasum -a 256 "${files[@]}"; fi \
            > "SHA256SUMS-${{ matrix.os }}.txt"

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

      # On tag pushes, attach the per-platform artifacts to the GitHub
      # Release for that tag. Each matrix job uploads its own files to
      # the same Release; softprops/action-gh-release creates the Release
      # on first run and appends on later runs.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          fail_on_unmatched_files: false
          body: |
            > Pre-1.0 build. macOS builds are signed with a Developer ID and
            > notarized, so they open normally. Windows builds are not signed
            > yet — SmartScreen may warn on first launch: **More info → Run
            > anyway**. The Linux AppImage needs `chmod +x`.
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS-*.txt

# Workflow registered on 2026-09-11.
